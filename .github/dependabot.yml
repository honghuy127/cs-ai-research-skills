version: 2
updates:
  # One grouped PR per ecosystem per month, instead of one PR per release.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    groups:
      dev-dependencies:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]
